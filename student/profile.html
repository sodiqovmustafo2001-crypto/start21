<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>START21 — Profil</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../student/student.css" />
  </head>

  <body>
    <div class="panel">
      <aside class="sidebar">
        <a href="../index.html" class="logo">
          <span class="logo__icon">A</span>
          <span class="logo__text">START<span>21</span></span>
        </a>

        <nav>
          <a href="dashboard.html">Bosh panel</a>
          <a href="courses.html">Kurslarim</a>
          <a href="tests.html">Testlar</a>
          <a href="profile.html" class="active">Profil</a>
        </nav>

        <a href="../pages/login.html" class="sidebar__logout">Chiqish</a>
      </aside>

      <main class="content">
        <div class="topbar">
          <div>
            <h1>Profil</h1>
            <p>Shaxsiy ma’lumotlaringizni yangilang.</p>
          </div>

          <div class="topbar__right">
            <button class="theme-btn" id="themeBtn" type="button">☾</button>
            <div class="user-chip"><span>A</span>Azizbek</div>
          </div>
        </div>

        <section class="box">
          <div class="profile-head">
            <div class="avatar">A</div>
            <div>
              <h2 style="margin: 0">Azizbek</h2>
              <p style="color: var(--text-light); font-size: 13px">English General · B1</p>
            </div>
          </div>

          <form id="profileForm">
            <div class="form-grid">
              <div class="field"><label for="fn">Ism</label><input id="fn" value="Azizbek" /></div>
              <div class="field"><label for="ln">Familiya</label><input id="ln" value="" placeholder="Familiyangiz" /></div>
              <div class="field"><label for="ph">Telefon raqam</label><input id="ph" type="tel" placeholder="+998 90 123 45 67" /></div>
              <div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="example@gmail.com" /></div>
              <div class="field">
                <label for="lv">Maqsad</label>
                <select id="lv">
                  <option>General English</option>
                  <option>IELTS</option>
                  <option>CEFR</option>
                  <option>SAT</option>
                  <option>DTM</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-small">Saqlash</button>
            <p class="form-note" id="note" hidden>Ma’lumotlar saqlandi.</p>
          </form>
        </section>
      </main>
    </div>

    <script>
      const themeBtn = document.getElementById("themeBtn");

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        themeBtn.textContent = "☀";
      }

      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        themeBtn.textContent = isDark ? "☀" : "☾";
      });

      document.getElementById("profileForm").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("note").hidden = false;
      });
    </script>
  </body>
</html>

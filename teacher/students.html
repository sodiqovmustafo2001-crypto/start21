<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>START21 — O‘quvchilar</title>

    <link rel="stylesheet" href="../style.css" />

    <link rel="stylesheet" href="../student/student.css" />

    <style>
      .students-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .search-input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        outline: none;
      }

      .search-input:focus {
        border-color: var(--primary);
      }

      .students-search {
        flex: 1;
      }

      .students-table-wrap {
        overflow-x: auto;
      }

      .student-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: white;
        font-weight: 800;
        margin-right: 10px;
        vertical-align: middle;
      }

      .student-name-cell {
        display: flex;
        align-items: center;
        min-width: 180px;
      }

      .student-name-text {
        min-width: 0;
      }

      .student-name {
        font-weight: 800;
        margin-bottom: 3px;
      }

      .student-contact {
        color: var(--text-light);
        font-size: 12px;
        word-break: break-word;
      }

      .student-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .students-empty {
        color: var(--text-light);
        text-align: center;
        padding: 25px 10px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1000;
      }

      .modal-overlay.show {
        display: flex;
      }

      .modal {
        width: min(520px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
        border-radius: 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }

      .modal__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .modal__header h2 {
        margin: 0;
      }

      .modal-close {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 18px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .form-group {
        display: grid;
        gap: 7px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 700;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        outline: none;
      }

      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      .cancel-button {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 18px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .save-button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      .message {
        min-height: 20px;
        margin-top: 12px;
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
      }

      .error-message {
        color: #dc2626;
      }

      .group-badge-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      @media (max-width: 700px) {
        .students-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .students-search {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <aside class="sidebar">
        <a href="../index.html" class="logo">
          <span class="logo__icon">A</span>

          <span class="logo__text"> START<span>21</span> </span>
        </a>

        <nav>
          <a href="dashboard.html"> Bosh panel </a>

          <a href="groups.html"> Guruhlar </a>

          <a href="students.html" class="active"> O‘quvchilar </a>

          <a href="attendance.html"> Davomat </a>

          <a href="results.html"> Natijalar </a>
        </nav>

        <a href="../pages/login.html" class="sidebar__logout"> Chiqish </a>
      </aside>

      <main class="content">
        <div class="topbar">
          <div>
            <h1>O‘quvchilar</h1>

            <p>Guruhlaringizdagi o‘quvchilarni boshqaring.</p>
          </div>

          <div class="topbar__right">
            <button class="theme-btn" id="themeBtn" type="button">☾</button>

            <div class="user-chip" id="userChip">
              <span>U</span>
              Ustoz
            </div>
          </div>
        </div>

        <section class="box">
          <div class="students-toolbar">
            <div class="students-search">
              <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Ism, email yoki telefon bo‘yicha qidiring..."
              />
            </div>

            <button id="openAddStudentButton" class="btn-small" type="button">
              + Yangi o‘quvchi
            </button>
          </div>

          <div id="pageMessage" class="message"></div>

          <div class="students-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>O‘quvchi</th>

                  <th>Telefon</th>

                  <th>Email</th>

                  <th>Guruhlar</th>

                  <th>Amal</th>
                </tr>
              </thead>

              <tbody id="studentsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal__header">
          <h2>Yangi o‘quvchi</h2>

          <button type="button" class="modal-close" id="closeModalButton">
            ×
          </button>
        </div>

        <form id="studentForm" class="form-grid">
          <div class="form-group">
            <label for="studentName"> Ism </label>

            <input
              id="studentName"
              type="text"
              placeholder="O‘quvchi ismi"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentEmail"> Email </label>

            <input
              id="studentEmail"
              type="email"
              placeholder="email@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentPhone"> Telefon </label>

            <input
              id="studentPhone"
              type="text"
              placeholder="+998 90 123 45 67"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentPassword"> Vaqtinchalik parol </label>

            <input
              id="studentPassword"
              type="password"
              placeholder="O‘quvchi uchun parol"
              required
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="studentGroup"> Guruh </label>

            <select id="studentGroup" required>
              <option value="">Guruhni tanlang</option>
            </select>
          </div>

          <div id="formMessage" class="message"></div>

          <div class="modal-actions">
            <button type="button" class="cancel-button" id="cancelModalButton">
              Bekor qilish
            </button>

            <button type="submit" class="save-button" id="saveStudentButton">
              O‘quvchini qo‘shish
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:5000";

      const themeBtn = document.getElementById("themeBtn");

      const userChip = document.getElementById("userChip");

      const searchInput = document.getElementById("searchInput");

      const studentsTableBody = document.getElementById("studentsTableBody");

      const openAddStudentButton = document.getElementById(
        "openAddStudentButton",
      );

      const modalOverlay = document.getElementById("modalOverlay");

      const closeModalButton = document.getElementById("closeModalButton");

      const cancelModalButton = document.getElementById("cancelModalButton");

      const studentForm = document.getElementById("studentForm");

      const studentName = document.getElementById("studentName");

      const studentEmail = document.getElementById("studentEmail");

      const studentPhone = document.getElementById("studentPhone");

      const studentPassword = document.getElementById("studentPassword");

      const studentGroup = document.getElementById("studentGroup");

      const saveStudentButton = document.getElementById("saveStudentButton");

      const formMessage = document.getElementById("formMessage");

      const pageMessage = document.getElementById("pageMessage");

      let currentUser = null;
      let groups = [];
      let students = [];

      function getCurrentUser() {
        const savedUser = localStorage.getItem("start21User");

        if (!savedUser) {
          return null;
        }

        try {
          return JSON.parse(savedUser);
        } catch (error) {
          return null;
        }
      }

      currentUser = getCurrentUser();

      if (!currentUser) {
        window.location.href = "../pages/login.html";

        throw new Error("Login kerak.");
      }

      if (currentUser.role !== "teacher") {
        window.location.href = "../student/dashboard.html";

        throw new Error("Teacher huquqi yo‘q.");
      }

      const teacherName = currentUser.name || "Ustoz";

      const firstLetter = teacherName.charAt(0).toUpperCase();

      userChip.innerHTML = `
        <span>${firstLetter}</span>
        ${teacherName}
      `;

      if (localStorage.getItem("start21Theme") === "dark") {
        document.body.classList.add("dark");

        themeBtn.textContent = "☀";
      }

      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        localStorage.setItem("start21Theme", isDark ? "dark" : "light");

        themeBtn.textContent = isDark ? "☀" : "☾";
      });

      function showMessage(element, message, error = false) {
        element.textContent = message;

        element.classList.toggle("error-message", error);

        if (message) {
          setTimeout(() => {
            element.textContent = "";
            element.classList.remove("error-message");
          }, 3500);
        }
      }

      async function loadGroups() {
        try {
          const response = await fetch(
            `${API_URL}/api/teacher/groups?teacherId=${currentUser.id}`,
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Guruhlarni olishda xatolik");
          }

          groups = data.groups || [];

          renderGroupOptions();
        } catch (error) {
          showMessage(pageMessage, error.message, true);
        }
      }

      function renderGroupOptions() {
        studentGroup.innerHTML = `
          <option value="">
            Guruhni tanlang
          </option>
        `;

        groups.forEach((group) => {
          const option = document.createElement("option");

          option.value = group.id;

          option.textContent = `${group.name} — ${
            group.level || "Intermediate"
          }`;

          studentGroup.appendChild(option);
        });
      }

      async function loadStudents(search = "") {
        try {
          const url = new URL(`${API_URL}/api/teacher/students`);

          url.searchParams.set("teacherId", currentUser.id);

          if (search.trim()) {
            url.searchParams.set("q", search.trim());
          }

          const response = await fetch(url.toString());

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "O‘quvchilarni olishda xatolik");
          }

          students = data.students || [];

          renderStudents();
        } catch (error) {
          studentsTableBody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="students-empty">
                  ${error.message}
                </div>
              </td>
            </tr>
          `;
        }
      }

      function getInitial(name) {
        return String(name || "T")
          .charAt(0)
          .toUpperCase();
      }

      function getGroupNames(student) {
        const names = (student.groupIds || [])
          .map((groupId) => {
            const group = groups.find(
              (item) => String(item.id) === String(groupId),
            );

            return group ? group.name : null;
          })
          .filter(Boolean);

        if (names.length === 0) {
          return `
            <span class="badge badge--gray">
              Guruhsiz
            </span>
          `;
        }

        return `
          <div class="group-badge-list">
            ${names
              .map(
                (name) => `
                  <span class="badge badge--gray">
                    ${name}
                  </span>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderStudents() {
        if (students.length === 0) {
          studentsTableBody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="students-empty">
                  O‘quvchi topilmadi.
                </div>
              </td>
            </tr>
          `;

          return;
        }

        studentsTableBody.innerHTML = students
          .map(
            (student) => `
                <tr>
                  <td>
                    <div class="student-name-cell">
                      <span class="student-avatar">
                        ${getInitial(student.name)}
                      </span>

                      <div class="student-name-text">
                        <div class="student-name">
                          ${student.name || "—"}
                        </div>

                        <div class="student-contact">
                          O‘quvchi
                        </div>
                      </div>
                    </div>
                  </td>

                  <td>
                    ${student.phone || "—"}
                  </td>

                  <td>
                    ${student.email || "—"}
                  </td>

                  <td>
                    ${getGroupNames(student)}
                  </td>

                  <td>
                    <div class="student-actions">
                      <a
                        href="student.html?id=${student.id}"
                        class="badge"
                      >
                        Profil
                      </a>

                      <a
                        href="results.html?studentId=${student.id}"
                        class="badge"
                      >
                        Natija
                      </a>

                      <a
                        href="attendance.html?studentId=${student.id}"
                        class="badge"
                      >
                        Davomat
                      </a>
                    </div>
                  </td>
                </tr>
              `,
          )
          .join("");
      }

      function openModal() {
        modalOverlay.classList.add("show");

        studentForm.reset();

        formMessage.textContent = "";

        renderGroupOptions();
      }

      function closeModal() {
        modalOverlay.classList.remove("show");

        studentForm.reset();

        formMessage.textContent = "";
      }

      openAddStudentButton.addEventListener("click", openModal);

      closeModalButton.addEventListener("click", closeModal);

      cancelModalButton.addEventListener("click", closeModal);

      modalOverlay.addEventListener("click", (event) => {
        if (event.target === modalOverlay) {
          closeModal();
        }
      });

      studentForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = studentName.value.trim();

        const email = studentEmail.value.trim();

        const phone = studentPhone.value.trim();

        const password = studentPassword.value;

        const groupId = studentGroup.value;

        if (!name || !email || !phone || !password || !groupId) {
          showMessage(formMessage, "Barcha maydonlarni to‘ldiring.", true);

          return;
        }

        try {
          saveStudentButton.disabled = true;

          saveStudentButton.textContent = "Saqlanmoqda...";

          const response = await fetch(`${API_URL}/api/teacher/students`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              teacherId: currentUser.id,
              name,
              email,
              phone,
              password,
              groupId,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "O‘quvchi qo‘shilmadi.");
          }

          closeModal();

          showMessage(pageMessage, "O‘quvchi muvaffaqiyatli qo‘shildi.");

          await loadGroups();

          await loadStudents(searchInput.value);
        } catch (error) {
          showMessage(formMessage, error.message, true);
        } finally {
          saveStudentButton.disabled = false;

          saveStudentButton.textContent = "O‘quvchini qo‘shish";
        }
      });

      searchInput.addEventListener("input", () => {
        loadStudents(searchInput.value);
      });

      const logoutButton = document.querySelector(".sidebar__logout");

      logoutButton.addEventListener("click", (event) => {
        event.preventDefault();

        localStorage.removeItem("start21User");

        window.location.href = "../pages/login.html";
      });

      async function init() {
        await loadGroups();

        await loadStudents();
      }

      init();
    </script>
  </body>
</html>

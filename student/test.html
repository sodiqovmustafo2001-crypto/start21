<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>START21 — IELTS Test</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../student/student.css" />

    <style>
      .test-container {
        max-width: 900px;
      }

      .test-progress {
        margin-top: 20px;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: var(--primary);
        transition: 0.3s;
      }

      .question-box {
        margin-top: 25px;
      }

      .question-number {
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 10px;
      }

      .question-text {
        font-size: 22px;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .answers {
        display: grid;
        gap: 12px;
      }

      .answer {
        width: 100%;
        padding: 16px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 12px;
        text-align: left;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
      }

      .answer:hover {
        border-color: var(--primary);
      }

      .answer.selected {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .test-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
      }

      .test-button {
        border: 0;
        border-radius: 10px;
        padding: 13px 22px;
        cursor: pointer;
        font-weight: 600;
      }

      .back-button {
        background: transparent;
        color: inherit;
        border: 1px solid var(--border);
      }

      .next-button {
        background: var(--primary);
        color: white;
      }

      .result-box {
        display: none;
        text-align: center;
        max-width: 900px;
      }

      .result-score {
        font-size: 55px;
        font-weight: 800;
        color: var(--primary);
        margin: 20px 0;
      }

      .result-correct-total {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .result-message {
        color: var(--text-light);
        margin-bottom: 25px;
      }

      .result-details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 25px;
      }

      .result-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }

      .result-card strong {
        display: block;
        font-size: 25px;
        margin-bottom: 5px;
      }

      @media (max-width: 700px) {
        .question-text {
          font-size: 19px;
        }

        .result-details {
          grid-template-columns: 1fr;
        }

        .test-actions {
          flex-direction: column;
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <aside class="sidebar">
        <a href="../index.html" class="logo">
          <span class="logo__icon">A</span>
          <span class="logo__text">START<span>21</span></span>
        </a>

        <nav>
          <a href="dashboard.html">Bosh panel</a>
          <a href="courses.html">Kurslarim</a>
          <a href="tests.html" class="active">Testlar</a>
          <a href="profile.html">Profil</a>
        </nav>

        <a href="../pages/login.html" class="sidebar__logout"> Chiqish </a>
      </aside>

      <main class="content">
        <div class="topbar">
          <div>
            <h1 id="testTitle">IELTS Test</h1>
            <p id="testDescription">Bilimingizni tekshiring.</p>
          </div>

          <div class="topbar__right">
            <button class="theme-btn" id="themeBtn" type="button">☾</button>

            <div class="user-chip" id="userChip">
              <span>T</span>
              Talaba
            </div>
          </div>
        </div>

        <section class="box test-container" id="testSection">
          <div class="test-progress">
            <div class="progress-info">
              <span id="questionCounter"> Savol 1 / 5 </span>

              <span id="progressPercent"> 0% </span>
            </div>

            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="question-box">
            <div class="question-number" id="questionNumber">Savol 1</div>

            <div class="question-text" id="questionText"></div>

            <div class="answers" id="answers"></div>
          </div>

          <div class="test-actions">
            <button
              class="test-button back-button"
              id="backButton"
              type="button"
            >
              Testlardan chiqish
            </button>

            <button
              class="test-button next-button"
              id="nextButton"
              type="button"
            >
              Keyingi
            </button>
          </div>
        </section>

        <section class="box result-box" id="resultSection">
          <h2>Test yakunlandi 🎉</h2>

          <div class="result-score" id="resultScore">0%</div>

          <div class="result-correct-total" id="resultCorrectTotal">
            0/0 ta to‘g‘ri
          </div>

          <p class="result-message" id="resultMessage"></p>

          <div class="result-details">
            <div class="result-card">
              <strong id="correctCount">0</strong>
              To‘g‘ri
            </div>

            <div class="result-card">
              <strong id="wrongCount">0</strong>
              Noto‘g‘ri
            </div>

            <div class="result-card">
              <strong id="totalCount">0</strong>
              Jami
            </div>
          </div>

          <button
            class="test-button next-button"
            id="returnButton"
            type="button"
          >
            Testlarga qaytish
          </button>
        </section>
      </main>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") || "listening";

      const tests = {
        listening: {
          title: "IELTS Listening Practice",
          description: "Listening bo‘yicha bilimingizni tekshiring.",
          questions: [
            {
              question: "The class starts at 9:30. What time does it start?",
              answers: ["8:30", "9:00", "9:30", "10:30"],
              correct: 2,
            },
            {
              question: "Which skill focuses on understanding spoken English?",
              answers: ["Listening", "Writing", "Reading", "Grammar"],
              correct: 0,
            },
            {
              question: "What should the student bring tomorrow?",
              answers: ["A laptop", "A notebook", "A dictionary", "A phone"],
              correct: 1,
            },
            {
              question: "Which word means the opposite of noisy?",
              answers: ["Busy", "Quiet", "Fast", "Large"],
              correct: 1,
            },
            {
              question: "What does 'Could you repeat that?' mean?",
              answers: [
                "Explain it",
                "Say it again",
                "Translate it",
                "Answer a question",
              ],
              correct: 1,
            },
          ],
        },

        reading: {
          title: "IELTS Reading Practice",
          description: "Reading bo‘yicha bilimingizni tekshiring.",
          questions: [
            {
              question: "What do many students use to improve their English?",
              answers: [
                "Sports clubs",
                "Online resources",
                "Travel guides",
                "Games only",
              ],
              correct: 1,
            },
            {
              question: "What is the main purpose of a title?",
              answers: [
                "Show the main topic",
                "Give a phone number",
                "Finish the text",
                "List every word",
              ],
              correct: 0,
            },
            {
              question: "Which word is closest to 'important'?",
              answers: ["Tiny", "Necessary", "Empty", "Slow"],
              correct: 1,
            },
            {
              question: "What helped students improve?",
              answers: [
                "Regular practice",
                "Long holidays",
                "Less studying",
                "New clothes",
              ],
              correct: 0,
            },
            {
              question:
                "What should you usually understand first when reading?",
              answers: [
                "Every single word",
                "The main topic",
                "The conclusion",
                "The examples",
              ],
              correct: 1,
            },
          ],
        },

        writing: {
          title: "IELTS Writing Practice",
          description: "Writing bo‘yicha bilimingizni tekshiring.",
          questions: [
            {
              question: "Which sentence is grammatically correct?",
              answers: [
                "She go to school every day.",
                "She goes to school every day.",
                "She going to school every day.",
                "She gone to school every day.",
              ],
              correct: 1,
            },
            {
              question: "Which word introduces a contrast?",
              answers: ["However", "Because", "Also", "Firstly"],
              correct: 0,
            },
            {
              question: "What should an essay introduction do?",
              answers: [
                "Introduce the topic",
                "Give only examples",
                "Repeat the conclusion",
                "List random vocabulary",
              ],
              correct: 0,
            },
            {
              question: "Which sentence is more formal?",
              answers: [
                "Kids gotta study hard.",
                "Students should study regularly.",
                "You guys should study.",
                "Studying is kinda cool.",
              ],
              correct: 1,
            },
            {
              question: "What should a conclusion usually do?",
              answers: [
                "Introduce a new topic",
                "Summarize the main ideas",
                "Add unrelated examples",
                "Start a new essay",
              ],
              correct: 1,
            },
          ],
        },

        speaking: {
          title: "IELTS Speaking Practice",
          description: "Speaking bo‘yicha bilimingizni tekshiring.",
          questions: [
            {
              question: "What is a natural answer to 'Where are you from?'",
              answers: [
                "I am from Namangan.",
                "Yes, I do.",
                "At seven o'clock.",
                "Because it is interesting.",
              ],
              correct: 0,
            },
            {
              question: "Which phrase gives you time to think?",
              answers: [
                "Let me think for a moment.",
                "Goodbye forever.",
                "Close the door.",
                "I don't know anything.",
              ],
              correct: 0,
            },
            {
              question: "Which answer gives a reason?",
              answers: [
                "I like reading because it is relaxing.",
                "Yes.",
                "At home.",
                "Seven.",
              ],
              correct: 0,
            },
            {
              question: "What is important during IELTS Speaking?",
              answers: [
                "Answer naturally and clearly",
                "Stay silent",
                "Speak as fast as possible",
                "Memorize every sentence",
              ],
              correct: 0,
            },
            {
              question: "Which phrase can introduce an opinion?",
              answers: [
                "In my opinion",
                "See you tomorrow",
                "Open the window",
                "I am twenty",
              ],
              correct: 0,
            },
          ],
        },

        mock: {
          title: "IELTS Mock Test",
          description: "Aralash IELTS mini test.",
          questions: [
            {
              question: "Which skill focuses on spoken English?",
              answers: ["Reading", "Listening", "Writing", "Speaking"],
              correct: 1,
            },
            {
              question: "Which sentence is correct?",
              answers: [
                "He have a car.",
                "He has a car.",
                "He having a car.",
                "He haves a car.",
              ],
              correct: 1,
            },
            {
              question: "What is the opposite of expensive?",
              answers: ["Cheap", "Large", "Strong", "Modern"],
              correct: 0,
            },
            {
              question: "Which phrase introduces an opinion?",
              answers: [
                "In my opinion",
                "At the station",
                "See you later",
                "Yesterday morning",
              ],
              correct: 0,
            },
            {
              question: "What can you do if you do not understand a question?",
              answers: [
                "Politely ask for clarification",
                "Leave immediately",
                "Say nothing",
                "Change the topic",
              ],
              correct: 0,
            },
          ],
        },
      };

      const currentTest = tests[type] || tests.listening;

      let currentQuestion = 0;
      let selectedAnswer = null;
      let score = 0;

      const testTitle = document.getElementById("testTitle");
      const testDescription = document.getElementById("testDescription");
      const questionCounter = document.getElementById("questionCounter");
      const progressPercent = document.getElementById("progressPercent");
      const progressFill = document.getElementById("progressFill");
      const questionNumber = document.getElementById("questionNumber");
      const questionText = document.getElementById("questionText");
      const answers = document.getElementById("answers");
      const nextButton = document.getElementById("nextButton");
      const testSection = document.getElementById("testSection");
      const resultSection = document.getElementById("resultSection");

      const userChip = document.getElementById("userChip");
      const themeBtn = document.getElementById("themeBtn");

      function getCurrentUser() {
        const savedUser = localStorage.getItem("start21User");

        if (!savedUser) {
          return null;
        }

        try {
          return JSON.parse(savedUser);
        } catch (error) {
          return null;
        }
      }

      function getUserKey() {
        const user = getCurrentUser();

        if (!user) {
          return null;
        }

        return String(user.id || user.email || "")
          .trim()
          .replace(/[^a-zA-Z0-9_-]/g, "_");
      }

      function getResultsKey() {
        const userKey = getUserKey();

        if (!userKey) {
          return null;
        }

        return `start21Results_${userKey}`;
      }

      function getUserResults() {
        const resultsKey = getResultsKey();

        if (!resultsKey) {
          return {};
        }

        const savedResults = localStorage.getItem(resultsKey);

        if (!savedResults) {
          return {};
        }

        try {
          return JSON.parse(savedResults) || {};
        } catch (error) {
          return {};
        }
      }

      function saveUserResults(results) {
        const resultsKey = getResultsKey();

        if (!resultsKey) {
          return;
        }

        localStorage.setItem(resultsKey, JSON.stringify(results));
      }

      function requireLogin() {
        const user = getCurrentUser();

        if (!user) {
          window.location.href = "../pages/login.html";
          return false;
        }

        return true;
      }

      if (!requireLogin()) {
        throw new Error("Foydalanuvchi tizimga kirmagan.");
      }

      const currentUser = getCurrentUser();

      if (currentUser) {
        const firstLetter = currentUser.name
          ? currentUser.name.charAt(0).toUpperCase()
          : "T";

        userChip.innerHTML = `
          <span>${firstLetter}</span>
          ${currentUser.name || "Talaba"}
        `;
      }

      testTitle.textContent = currentTest.title;
      testDescription.textContent = currentTest.description;

      function showQuestion() {
        const question = currentTest.questions[currentQuestion];

        selectedAnswer = null;

        questionNumber.textContent = `Savol ${currentQuestion + 1}`;

        questionCounter.textContent = `Savol ${currentQuestion + 1} / ${currentTest.questions.length}`;

        const percent = Math.round(
          (currentQuestion / currentTest.questions.length) * 100,
        );

        progressPercent.textContent = `${percent}%`;

        progressFill.style.width = `${percent}%`;

        questionText.textContent = question.question;

        answers.innerHTML = "";

        question.answers.forEach((answer, index) => {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "answer";
          button.textContent = answer;

          button.addEventListener("click", () => {
            document.querySelectorAll(".answer").forEach((item) => {
              item.classList.remove("selected");
            });

            button.classList.add("selected");

            selectedAnswer = index;
          });

          answers.appendChild(button);
        });

        nextButton.textContent =
          currentQuestion === currentTest.questions.length - 1
            ? "Yakunlash"
            : "Keyingi";
      }

      nextButton.addEventListener("click", () => {
        if (selectedAnswer === null) {
          alert("Avval javoblardan birini tanlang.");
          return;
        }

        const question = currentTest.questions[currentQuestion];

        if (selectedAnswer === question.correct) {
          score++;
        }

        if (currentQuestion === currentTest.questions.length - 1) {
          finishTest();
          return;
        }

        currentQuestion++;

        showQuestion();
      });

      function finishTest() {
        const total = currentTest.questions.length;
        const correct = score;
        const wrong = total - correct;

        const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;

        testSection.style.display = "none";
        resultSection.style.display = "block";

        document.getElementById("resultScore").textContent = `${percentage}%`;

        document.getElementById("resultCorrectTotal").textContent =
          `${correct}/${total} ta to‘g‘ri`;

        document.getElementById("correctCount").textContent = correct;

        document.getElementById("wrongCount").textContent = wrong;

        document.getElementById("totalCount").textContent = total;

        document.getElementById("resultMessage").textContent =
          percentage >= 80
            ? "Juda yaxshi natija!"
            : percentage >= 60
              ? "Yaxshi natija. Yana mashq qiling."
              : "Ko‘proq mashq qilish foydali bo‘ladi.";

        const results = getUserResults();

        results[type] = {
          correct: correct,
          total: total,
          percentage: percentage,
        };

        saveUserResults(results);

        progressPercent.textContent = "100%";
        progressFill.style.width = "100%";
      }

      document.getElementById("backButton").addEventListener("click", () => {
        window.location.href = "tests.html";
      });

      document.getElementById("returnButton").addEventListener("click", () => {
        window.location.href = "tests.html";
      });

      const savedTheme = localStorage.getItem("start21Theme");

      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeBtn.textContent = "☀";
      }

      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        localStorage.setItem("start21Theme", isDark ? "dark" : "light");

        themeBtn.textContent = isDark ? "☀" : "☾";
      });

      showQuestion();
    </script>
  </body>
</html>

<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>START21 — Bepul daraja testi</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .dg { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 60px; }
      .dg__top { width: min(100%, 720px); display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
      .dg__back { font-size: 13px; font-weight: 600; color: var(--text-light); }
      .dg__back:hover { color: var(--primary); }
      .dg-card { width: min(100%, 720px); padding: 36px; border: 1px solid var(--border); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); }
      .dg-progress { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-light); margin-bottom: 10px; }
      .dg-bar { height: 8px; border-radius: 10px; background: var(--primary-light); overflow: hidden; }
      .dg-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(100deg, #1769ff, #6850ef); transition: width 0.4s ease; }
      .dg-question { margin: 30px 0 22px; font-size: 24px; line-height: 1.35; letter-spacing: -0.5px; }
      .dg-options { display: grid; gap: 12px; }
      .dg-option { width: 100%; padding: 16px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--text); font-size: 15px; font-weight: 500; text-align: left; transition: 0.2s ease; }
      .dg-option:hover { border-color: var(--primary); background: var(--primary-light); }
      .dg-option.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 700; }
      .dg-next { width: 100%; height: 52px; margin-top: 24px; border-radius: 13px; background: linear-gradient(100deg, #1769ff, #6850ef); color: #fff; font-size: 14px; font-weight: 700; box-shadow: 0 12px 25px rgba(23, 105, 255, 0.2); transition: 0.3s ease; }
      .dg-next:hover:not(:disabled) { transform: translateY(-3px); }
      .dg-next:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .dg-result { text-align: center; }
      .dg-level { width: 130px; height: 130px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 50%; border: 6px solid var(--primary); font-size: 40px; font-weight: 800; color: var(--primary); }
      .dg-result h2 { font-size: 26px; letter-spacing: -0.8px; }
      .dg-result p { max-width: 460px; margin: 12px auto 0; color: var(--text-light); font-size: 15px; }
      .dg-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
      .dg-actions a, .dg-actions button { padding: 14px 24px; border-radius: 13px; font-size: 14px; font-weight: 700; }
      .dg-primary { background: var(--primary); color: #fff; }
      .dg-secondary { border: 1px solid var(--border); background: var(--card); color: var(--text); }
      [hidden] { display: none !important; }
      @media (max-width: 600px) { .dg-card { padding: 24px 18px; } .dg-question { font-size: 20px; } }
    </style>
  </head>

  <body>
    <main class="dg">
      <div class="dg__top">
        <a href="../index.html" class="logo">
          <span class="logo__icon">A</span>
          <span class="logo__text">START<span>21</span></span>
        </a>
        <a href="../index.html" class="dg__back">← Bosh sahifa</a>
      </div>

      <section class="dg-card" id="quiz">
        <div class="dg-progress">
          <span id="dgCount">Savol 1 / 10</span>
          <span>Bepul daraja testi</span>
        </div>
        <div class="dg-bar"><span id="dgBar"></span></div>

        <h1 class="dg-question" id="dgQuestion"></h1>
        <div class="dg-options" id="dgOptions"></div>

        <button class="dg-next" id="dgNext" disabled>Keyingisi</button>
      </section>

      <section class="dg-card dg-result" id="result" hidden>
        <div class="dg-level" id="dgLevel"></div>
        <h2 id="dgTitle"></h2>
        <p id="dgText"></p>

        <div class="dg-actions">
          <a href="register.html" class="dg-primary">Kursga yozilish</a>
          <a href="courses.html" class="dg-secondary">Kurslarni ko‘rish</a>
          <button class="dg-secondary" id="dgRestart">Qayta topshirish</button>
        </div>
      </section>
    </main>

    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
      }

      const questions = [
        { q: "She ___ to school every day.", o: ["go", "goes", "going", "gone"], a: 1 },
        { q: "Listen! The children ___ in the garden now.", o: ["play", "plays", "are playing", "played"], a: 2 },
        { q: "There aren’t ___ apples in the bag.", o: ["any", "some", "a", "an"], a: 0 },
        { q: "Yesterday we ___ to the park.", o: ["go", "goes", "going", "went"], a: 3 },
        { q: "If it rains tomorrow, we ___ at home.", o: ["stay", "will stay", "stayed", "would stay"], a: 1 },
        { q: "I have lived in this city ___ 2019.", o: ["for", "since", "from", "at"], a: 1 },
        { q: "The report ___ by the manager yesterday.", o: ["wrote", "is writing", "was written", "has wrote"], a: 2 },
        { q: "If I ___ more time, I would learn another language.", o: ["have", "will have", "has had", "had"], a: 3 },
        { q: "She suggested ___ the meeting until Monday.", o: ["to postpone", "postpone", "postponed", "postponing"], a: 3 },
        { q: "Hardly ___ the office when the phone rang.", o: ["he had entered", "had he entered", "did he enter", "he entered"], a: 1 }
      ];

      const levels = [
        { max: 2, code: "A1", title: "Boshlang‘ich daraja", text: "Siz ingliz tilini endi boshlayapsiz. English General kursi sizni noldan ishonchli darajaga olib chiqadi." },
        { max: 4, code: "A2", title: "Elementar daraja", text: "Asosiy grammatikani bilasiz. English General kursida gapirish va yozish ko‘nikmalarini mustahkamlaysiz." },
        { max: 6, code: "B1", title: "O‘rta daraja", text: "Kundalik mavzularda muloqot qila olasiz. English General yoki IELTS kursiga tayyorlov boshlash uchun yaxshi nuqta." },
        { max: 8, code: "B2", title: "O‘rtadan yuqori daraja", text: "Sizning darajangiz IELTS Intensive kursi uchun mos. Imtihon formatiga tayyorlanishni boshlashingiz mumkin." },
        { max: 10, code: "C1", title: "Ilg‘or daraja", text: "Ajoyib natija! IELTS Intensive kursida yuqori ball uchun strategiya va mock testlar ustida ishlaymiz." }
      ];

      const $ = (id) => document.getElementById(id);
      let index = 0;
      let score = 0;
      let chosen = null;

      function showQuestion() {
        const item = questions[index];
        chosen = null;

        $("dgCount").textContent = "Savol " + (index + 1) + " / " + questions.length;
        $("dgBar").style.width = (index / questions.length) * 100 + "%";
        $("dgQuestion").textContent = item.q;
        $("dgNext").disabled = true;
        $("dgNext").textContent = index === questions.length - 1 ? "Natijani ko‘rish" : "Keyingisi";

        $("dgOptions").innerHTML = "";
        item.o.forEach((text, i) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "dg-option";
          button.textContent = text;
          button.addEventListener("click", () => {
            chosen = i;
            document.querySelectorAll(".dg-option").forEach((b) => b.classList.remove("selected"));
            button.classList.add("selected");
            $("dgNext").disabled = false;
          });
          $("dgOptions").appendChild(button);
        });
      }

      function showResult() {
        const level = levels.find((l) => score <= l.max);
        $("quiz").hidden = true;
        $("result").hidden = false;
        $("dgLevel").textContent = level.code;
        $("dgTitle").textContent = level.title + " — " + score + " / " + questions.length;
        $("dgText").textContent = level.text;
      }

      $("dgNext").addEventListener("click", () => {
        if (chosen === null) return;
        if (chosen === questions[index].a) score++;
        index++;
        index < questions.length ? showQuestion() : showResult();
      });

      $("dgRestart").addEventListener("click", () => {
        index = 0;
        score = 0;
        $("result").hidden = true;
        $("quiz").hidden = false;
        showQuestion();
      });

      showQuestion();
    </script>
  </body>
</html>
